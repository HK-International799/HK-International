<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/hk_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- =========================================================
         PRIMARY META TAGS

         IMPORTANT — SPA indexing note (read before editing):
         This is a client-rendered Vite/React SPA: every route (/, /about,
         /course/:id, /blog/:slug ...) is served from this SAME index.html.
         The <SEO /> component (src/components/SEO.jsx) renders the real,
         per-page <title>, description, canonical, hreflang, OG and Twitter
         tags on every route via React 19's native head-tag hoisting.

         React only de-dupes tags that IT renders — it cannot see or remove
         hand-written tags already sitting in this file. So a hard-coded
         <title>/description/canonical/hreflang HERE would sit in the DOM
         *alongside* the SEO component's tags on every non-home route,
         producing two conflicting <title> elements and two conflicting
         <link rel="canonical"> elements pointing at different URLs.

         That is a direct, well-documented cause of Search Console's
         "Alternate page with proper canonical tag" / "Discovered - currently
         not indexed" / "Crawled - currently not indexed" exclusions — Google
         does not know which canonical to trust and, in this site's case,
         picked the homepage for every route, so every non-home page (~32+
         course/about/blog pages) is currently sitting unindexed.

         Do NOT re-add a static title/description/canonical/hreflang below.
         Every route already sets these correctly via <SEO />. If you need a
         fallback for non-JS clients, add it to the <noscript> block instead.
    ========================================================== -->

    <meta name="author" content="1A HK International" />
    <meta name="publisher" content="1A HK International" />
    <meta name="copyright" content="1A HK International" />
    <meta name="application-name" content="1A HK International LMS" />
    <meta name="apple-mobile-web-app-title" content="1A HK International" />
    <meta name="generator" content="React + Vite" />
    <meta name="rating" content="General" />
    <meta name="distribution" content="Global" />
    <meta name="revisit-after" content="7 days" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Theme / Browser UI colors -->
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="msapplication-TileColor" content="#1e3a5f" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="light" />

    <!-- Robots / Indexing -->
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta
      name="googlebot"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta name="bingbot" content="index, follow" />

    <!-- Geo / Locale (HQ: London, UK) -->
    <meta name="geo.region" content="GB-NWM" />
    <meta name="geo.placename" content="London, East Ham" />
    <meta name="geo.position" content="51.5391;0.0524" />
    <meta name="ICBM" content="51.5391, 0.0524" />
    <meta http-equiv="Content-Language" content="en" />
    <meta name="language" content="English" />

    <!-- =========================================================
         CANONICAL & ALTERNATES
         Intentionally NOT set here — see note above. Every route sets its
         own canonical via <SEO url={...} />. A static one here would
         override/conflict with the correct per-page canonical on every
         route except "/".
    ========================================================== -->

    <!-- Sitemap discovery -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- =========================================================
         OPEN GRAPH (Facebook, LinkedIn, WhatsApp, etc.)
         og:type / og:title / og:description / og:url are set per-page by
         <SEO /> (same conflict risk as title/canonical above) — only truly
         global, non-page-specific fields live here.
    ========================================================== -->
    <meta property="og:site_name" content="1A HK International" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="en_IN" />
    <meta property="og:image" content="https://hkinternational.uk/images/hk_logo.png" />
    <meta property="og:image:secure_url" content="https://hkinternational.uk/images/hk_logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="1A HK International - Accredited HSE Training" />

    <!-- Facebook page reference -->
    <meta
      property="article:publisher"
      content="https://www.facebook.com/profile.php?id=61578676434716"
    />
    <meta property="fb:app_id" content="" />

    <!-- =========================================================
         TWITTER / X CARD
         twitter:title / twitter:description / twitter:url are set per-page
         by <SEO /> — only global fields live here.
    ========================================================== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@1a_hk85756" />
    <meta name="twitter:creator" content="@1a_hk85756" />
    <meta name="twitter:image" content="https://hkinternational.uk/images/hk_logo.png" />
    <meta name="twitter:image:alt" content="1A HK International - Accredited HSE Training" />

    <!-- =========================================================
         PERFORMANCE: preconnect / dns-prefetch
    ========================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://api.emailjs.com" />

    <!-- Preload main logo for instant LCP -->
    <link rel="preload" as="image" href="/images/hk_logo.png" />

    <!-- Preload the homepage hero's first slide (its LCP image on most
         visits). Vite/React is a single index.html for the whole SPA, so
         this preload ships on every route — a small, deliberate tradeoff
         since Home is the highest-traffic entry page. -->
    <link rel="preload" as="image" href="/slides/osha_iosh_slideshow.webp" />

    <!-- WebSite schema with SearchAction (helps sitelinks searchbox) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://hkinternational.uk/#website",
      "url": "https://hkinternational.uk/",
      "name": "1A HK International",
      "description": "Accredited online HSE training courses - IOSH, OTHM, OSHA, CIEH, PECB ISO, ESC, EOSH.",
      "publisher": { "@id": "https://hkinternational.uk/#organization" },
      "inLanguage": "en-GB",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://hkinternational.uk/courses?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
